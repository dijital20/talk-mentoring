# This is a basic workflow to help you get started with Actions

name: Convert md to html
on: [push, workflow_dispatch]
jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v3

      - name: Print directory
        run: ls -a

      # Lightning talk
      - name: Export Lightning Slides HTML
        run: npx @marp-team/marp-cli@latest lightning/SLIDES.md --html true -o Mentoring_Lightning_Slides.html

      - name: Export Lightning Slides PDF
        run: npx @marp-team/marp-cli@latest lightning/SLIDES.md --pdf true --html true --pdf-notes true --allow-local-files -o Mentoring_Lightning_Slides.pdf

      # Full talk
      - name: Export Full Slides HTML
        run: npx @marp-team/marp-cli@latest full/SLIDES.md --html true -o Mentoring_Full_Slides.html

      - name: Export Full Slides PDF
        run: npx @marp-team/marp-cli@latest full/SLIDES.md --pdf true --html true --allow-local-files --pdf-notes true -o Mentoring_Full_Slides.pdf

      - name: Copy Images
        run: cp -R full/img img

      # Debugging...
      - name: Print directory
        run: ls -a

      - name: Archive Exports
        uses: actions/upload-artifact@v7
        with:
          name: Notes Exports
          path: |
            Mentoring_*
            img/*
          retention-days: 7

      - name: Tag branch (main only)
        if: endswith(github.ref, 'main')
        uses: mydea/action-tag-date-version@20.11.0
        id: version-tag

      - name: Cut a release (main only)
        uses: ncipollo/release-action@v1
        if: endsWith(github.ref, 'main')
        with:
          artifacts: Mentoring_*
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version-tag.outputs.version }}
